<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>학급 자리 배치 QR 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      70% { transform: scale(1.04); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="app"></div>
  <div id="modal-root"></div>

  <script>
    const STORAGE_STATE_KEY = 'classroom_seat_state_v6';
    const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('classroom_seat_bc_v6') : null;

    const urlParams = new URLSearchParams(window.location.search);
    const isStudentMode = urlParams.get('mode') === 'student';

    // 도메인 기반 고정 채널 ID (교사 PC와 학생 태블릿이 항상 동일한 방에 자동 접속)
    function getFixedChannelId() {
      const host = (window.location.hostname || 'local-classroom')
        .replace(/[^a-zA-Z0-9]/g, '_')
        .toLowerCase();
      return 'seatqr_v6_' + host;
    }

    const CHANNEL_ID = getFixedChannelId();
    const NTFY_URL = 'https://ntfy.sh/' + CHANNEL_ID;

    const MQTT_BROKERS = [
      'wss://broker.emqx.io:8084/mqtt',
      'wss://broker.hivemq.com:8884/mqtt',
      'wss://mqtt.eclipseprojects.io:443/mqtt'
    ];
    const MQTT_TOPIC_STATE = CHANNEL_ID + '/state';
    const MQTT_TOPIC_EVENT = CHANNEL_ID + '/event';

    function formatTime(date = new Date()) {
      return date.toTimeString().split(' ')[0];
    }

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_STATE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed.totalSeats === 'number' && Array.isArray(parsed.assigned)) {
            return {
              resetId: parsed.resetId || 'init_v6',
              totalSeats: parsed.totalSeats,
              assigned: parsed.assigned,
              updatedAt: parsed.updatedAt || Date.now()
            };
          }
        }
      } catch (e) {}
      return {
        resetId: 'init_v6',
        totalSeats: 27,
        assigned: [],
        updatedAt: Date.now()
      };
    }

    let state = loadSavedState();
    let syncStatus = 'connecting';
    let showQrModal = false;
    let customHostInput = '';
    let lastRenderedQrUrl = '';

    let mqttClients = [];
    let ntfyEventSource = null;

    // 학생 화면 상태
    let studentStep = 'input'; // 'input' | 'drawing' | 'result' | 'already' | 'full'
    let studentNameInput = '';
    let studentResult = null;
    let studentErrorMsg = '';

    function saveStateToLocal() {
      try {
        localStorage.setItem(STORAGE_STATE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function updateSyncStatus(nextStatus) {
      if (syncStatus !== nextStatus) {
        syncStatus = nextStatus;
        if (!isStudentMode) renderAdminBoardOnly();
      }
    }

    // 실시간 수신 데이터 병합
    function applyIncomingPayload(payload) {
      if (!payload || typeof payload !== 'object') return false;
      let changed = false;

      if (payload.type === 'RESET_STATE') {
        if (payload.resetId !== state.resetId || payload.totalSeats !== state.totalSeats || state.assigned.length > 0) {
          state = {
            resetId: payload.resetId,
            totalSeats: payload.totalSeats,
            assigned: [],
            updatedAt: payload.updatedAt || Date.now()
          };
          changed = true;
        }
      } else if (payload.type === 'ASSIGN_SEAT' && payload.record) {
        if (state.resetId === 'init_v6' && payload.resetId) {
          state.resetId = payload.resetId;
        }
        if (!payload.resetId || payload.resetId === state.resetId) {
          if (payload.totalSeats && payload.totalSeats !== state.totalSeats) {
            state.totalSeats = payload.totalSeats;
            changed = true;
          }
          const rec = payload.record;
          const seatTaken = state.assigned.some(item => item.seat === rec.seat);
          const nameTaken = state.assigned.some(item => item.name === rec.name);
          if (!seatTaken && !nameTaken) {
            state.assigned = [...state.assigned, rec];
            state.updatedAt = Date.now();
            changed = true;
          }
        }
      } else if (payload.type === 'UNASSIGN_SEAT' && typeof payload.seat === 'number') {
        const beforeLen = state.assigned.length;
        state.assigned = state.assigned.filter(item => item.seat !== payload.seat);
        if (state.assigned.length !== beforeLen) {
          state.updatedAt = Date.now();
          changed = true;
        }
      } else if (payload.type === 'SYNC_STATE' && Array.isArray(payload.assigned)) {
        if (payload.resetId !== state.resetId) {
          if ((payload.updatedAt || 0) >= (state.updatedAt || 0) || state.resetId === 'init_v6') {
            state = {
              resetId: payload.resetId,
              totalSeats: payload.totalSeats || state.totalSeats,
              assigned: payload.assigned,
              updatedAt: payload.updatedAt || Date.now()
            };
            changed = true;
          }
        } else {
          if (payload.totalSeats && payload.totalSeats !== state.totalSeats) {
            state.totalSeats = payload.totalSeats;
            changed = true;
          }
          const merged = [...state.assigned];
          payload.assigned.forEach((rec) => {
            if (!merged.some(m => m.seat === rec.seat || m.name === rec.name)) {
              merged.push(rec);
              changed = true;
            }
          });
          if (changed) {
            state.assigned = merged;
            state.updatedAt = Math.max(state.updatedAt || 0, payload.updatedAt || 0);
          }
        }
      }

      if (changed) {
        saveStateToLocal();
        if (!isStudentMode) {
          renderAdminBoardOnly();
        }
      }
      return changed;
    }

    // 클라우드(HTTPS + MQTT + BroadcastChannel)로 상태 전송
    async function broadcastPayload(payload) {
      const jsonStr = JSON.stringify(payload);

      if (bc) {
        try { bc.postMessage(payload); } catch (e) {}
      }

      const stateSnapshotStr = JSON.stringify({
        type: 'SYNC_STATE',
        resetId: state.resetId,
        totalSeats: state.totalSeats,
        assigned: state.assigned,
        updatedAt: state.updatedAt
      });

      mqttClients.forEach((client) => {
        if (client && client.connected) {
          try {
            client.publish(MQTT_TOPIC_EVENT, jsonStr, { qos: 1 });
            client.publish(MQTT_TOPIC_STATE, stateSnapshotStr, { qos: 1, retain: true });
          } catch (e) {}
        }
      });

      try {
        await fetch(NTFY_URL, {
          method: 'POST',
          body: jsonStr
        });
      } catch (e) {}
    }

    // HTTPS 서버에서 최근 이벤트 기록을 읽어와 정확히 동기화
    async function syncFromCloud() {
      try {
        const res = await fetch(NTFY_URL + '/json?poll=1&since=6h&_t=' + Date.now(), {
          cache: 'no-store'
        });
        if (!res.ok) return false;
        const text = await res.text();
        const lines = text.trim().split(/\r?\n/);

        let tempResetId = state.resetId;
        let tempTotalSeats = state.totalSeats;
        let tempAssigned = [...state.assigned];
        let hasServerEvents = false;

        let foundResetInLog = false;
        for (const line of lines) {
          if (!line) continue;
          try {
            const wrapper = JSON.parse(line);
            if (wrapper.event === 'message' && wrapper.message) {
              const ev = JSON.parse(wrapper.message);
              if (ev.type === 'RESET_STATE') {
                foundResetInLog = true;
              }
            }
          } catch (e) {}
        }

        if (foundResetInLog) {
          tempAssigned = [];
        }

        for (const line of lines) {
          if (!line) continue;
          try {
            const wrapper = JSON.parse(line);
            if (wrapper.event === 'message' && wrapper.message) {
              const ev = JSON.parse(wrapper.message);
              if (ev.type === 'RESET_STATE') {
                tempResetId = ev.resetId;
                tempTotalSeats = ev.totalSeats;
                tempAssigned = [];
                hasServerEvents = true;
              } else if (ev.type === 'SYNC_STATE' && Array.isArray(ev.assigned)) {
                if (ev.resetId !== tempResetId) {
                  tempResetId = ev.resetId;
                  tempTotalSeats = ev.totalSeats || tempTotalSeats;
                  tempAssigned = [...ev.assigned];
                } else {
                  tempTotalSeats = ev.totalSeats || tempTotalSeats;
                  ev.assigned.forEach(r => {
                    if (!tempAssigned.some(a => a.seat === r.seat || a.name === r.name)) {
                      tempAssigned.push(r);
                    }
                  });
                }
                hasServerEvents = true;
              } else if (ev.type === 'ASSIGN_SEAT' && ev.record) {
                if (!ev.resetId || ev.resetId === tempResetId || tempResetId === 'init_v6') {
                  if (ev.resetId) tempResetId = ev.resetId;
                  if (ev.totalSeats) tempTotalSeats = ev.totalSeats;
                  if (!tempAssigned.some(a => a.seat === ev.record.seat || a.name === ev.record.name)) {
                    tempAssigned.push(ev.record);
                  }
                  hasServerEvents = true;
                }
              } else if (ev.type === 'UNASSIGN_SEAT' && typeof ev.seat === 'number') {
                tempAssigned = tempAssigned.filter(a => a.seat !== ev.seat);
                hasServerEvents = true;
              }
            }
          } catch (innerErr) {}
        }

        if (hasServerEvents) {
          const prevSig = JSON.stringify(state.assigned) + state.totalSeats + state.resetId;
          const nextSig = JSON.stringify(tempAssigned) + tempTotalSeats + tempResetId;
          if (prevSig !== nextSig) {
            state = {
              resetId: tempResetId,
              totalSeats: tempTotalSeats,
              assigned: tempAssigned,
              updatedAt: Date.now()
            };
            saveStateToLocal();
            if (!isStudentMode) renderAdminBoardOnly();
          }
        }
        updateSyncStatus('connected');
        return true;
      } catch (e) {
        return false;
      }
    }

    function initRealtimeEngines() {
      if (bc) {
        bc.onmessage = (ev) => {
          if (ev.data) applyIncomingPayload(ev.data);
        };
      }

      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_STATE_KEY && e.newValue && !isStudentMode) {
          try {
            state = JSON.parse(e.newValue);
            renderAdminBoardOnly();
          } catch (err) {}
        }
      });

      // 1. HTTPS SSE 스트림 수신
      if ('EventSource' in window) {
        try {
          ntfyEventSource = new EventSource(NTFY_URL + '/sse');
          ntfyEventSource.onopen = () => {
            updateSyncStatus('connected');
          };
          ntfyEventSource.onmessage = (event) => {
            try {
              const wrapper = JSON.parse(event.data);
              const payload = wrapper.message ? JSON.parse(wrapper.message) : wrapper;
              applyIncomingPayload(payload);
            } catch (e) {}
          };
        } catch (e) {}
      }

      // 2. MQTT WebSocket 브로커 수신
      if (typeof mqtt !== 'undefined') {
        MQTT_BROKERS.forEach((brokerUrl) => {
          try {
            const client = mqtt.connect(brokerUrl, {
              keepalive: 30,
              reconnectPeriod: 3000,
              connectTimeout: 6000
            });

            client.on('connect', () => {
              updateSyncStatus('connected');
              client.subscribe(MQTT_TOPIC_STATE, { qos: 1 });
              client.subscribe(MQTT_TOPIC_EVENT, { qos: 1 });
            });

            client.on('message', (topic, message) => {
              try {
                const payload = JSON.parse(message.toString());
                applyIncomingPayload(payload);
              } catch (err) {}
            });

            mqttClients.push(client);
          } catch (e) {}
        });
      }

      // 3. 초기 동기화 및 교사 화면 2.5초 주기 자동 폴링
      syncFromCloud().then(() => {
        if (!isStudentMode && state.resetId === 'init_v6') {
          state.resetId = 'r_' + Date.now();
          saveStateToLocal();
          broadcastPayload({
            type: 'SYNC_STATE',
            resetId: state.resetId,
            totalSeats: state.totalSeats,
            assigned: state.assigned,
            updatedAt: Date.now()
          });
        }
      });

      if (!isStudentMode) {
        setInterval(() => {
          syncFromCloud();
        }, 2500);
      }
    }

    // [학생] 이름 입력 후 번호 추첨
    async function handleStudentDraw(e) {
      if (e) e.preventDefault();
      const name = studentNameInput.trim();
      if (!name) {
        studentErrorMsg = '이름을 입력해 주세요.';
        render();
        return;
      }

      studentErrorMsg = '';
      studentStep = 'drawing';
      render();

      try {
        await syncFromCloud();

        for (let attempt = 0; attempt < 4; attempt++) {
          const existing = state.assigned.find(item => item.name === name);
          if (existing) {
            studentResult = existing;
            studentStep = 'already';
            render();
            return;
          }

          const assignedSet = new Set(state.assigned.map(item => item.seat));
          const available = [];
          for (let i = 1; i <= state.totalSeats; i++) {
            if (!assignedSet.has(i)) available.push(i);
          }

          if (available.length === 0) {
            studentStep = 'full';
            render();
            return;
          }

          const chosenSeat = available[Math.floor(Math.random() * available.length)];
          const drawId = 'd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          const record = {
            seat: chosenSeat,
            name: name,
            time: formatTime(),
            drawId: drawId
          };

          state.assigned = [...state.assigned, record];
          state.updatedAt = Date.now();
          saveStateToLocal();

          await broadcastPayload({
            type: 'ASSIGN_SEAT',
            resetId: state.resetId,
            totalSeats: state.totalSeats,
            record: record
          });

          // 0.3초 대기 후 서버 로그 재검증 (동시 클릭 시 중복 배정 원천 차단)
          await new Promise(r => setTimeout(r, 300));
          const synced = await syncFromCloud();

          if (!synced) {
            studentResult = record;
            studentStep = 'result';
            render();
            return;
          }

          const myConfirmed = state.assigned.find(item => item.name === name);
          if (myConfirmed) {
            studentResult = myConfirmed;
            studentStep = 'result';
            render();
            return;
          }
        }

        throw new Error('다시 한 번 버튼을 눌러주세요.');
      } catch (err) {
        studentStep = 'input';
        studentErrorMsg = err.message || '일시적인 지연이 발생했습니다. 다시 눌러주세요.';
        render();
      }
    }

    function getStudentJoinUrl(customBaseUrl = '') {
      let base = (customBaseUrl || '').trim();
      if (!base) {
        const { protocol, host, pathname } = window.location;
        if (protocol === 'http:' || protocol === 'https:') {
          base = protocol + '//' + host + pathname;
        }
      }
      if (!base) return '';
      try {
        const u = new URL(base);
        u.search = '';
        u.hash = '';
        u.searchParams.set('mode', 'student');
        return u.toString();
      } catch (e) {
        return '';
      }
    }

    async function handleSetTotalSeats(count) {
      const n = parseInt(count, 10);
      if (isNaN(n) || n < 1 || n > 100) {
        alert('1명에서 100명 사이의 숫자를 입력해 주세요.');
        return;
      }
      const newResetId = 'r_' + Date.now();
      state = {
        resetId: newResetId,
        totalSeats: n,
        assigned: [],
        updatedAt: Date.now()
      };
      saveStateToLocal();
      renderAdminBoardOnly();

      await broadcastPayload({
        type: 'RESET_STATE',
        resetId: newResetId,
        totalSeats: n,
        updatedAt: state.updatedAt
      });
    }

    async function resetAssignments() {
      if (state.assigned.length === 0) return;
      if (!confirm('모든 자리 배정 기록(이름 및 번호)을 초기화하시겠습니까?')) return;
      const newResetId = 'r_' + Date.now();
      state = {
        resetId: newResetId,
        totalSeats: state.totalSeats,
        assigned: [],
        updatedAt: Date.now()
      };
      saveStateToLocal();
      renderAdminBoardOnly();

      await broadcastPayload({
        type: 'RESET_STATE',
        resetId: newResetId,
        totalSeats: state.totalSeats,
        updatedAt: state.updatedAt
      });
    }

    async function toggleSeatManually(seatNum) {
      const exists = state.assigned.find(item => item.seat === seatNum);
      if (exists) {
        if (!confirm(seatNum + '번 (' + (exists.name || '이름없음') + ') 배정을 취소하시겠습니까?')) return;
        state.assigned = state.assigned.filter(item => item.seat !== seatNum);
        state.updatedAt = Date.now();
        saveStateToLocal();
        renderAdminBoardOnly();

        await broadcastPayload({
          type: 'UNASSIGN_SEAT',
          resetId: state.resetId,
          seat: seatNum
        });
      } else {
        const manualName = prompt(seatNum + '번 자리에 수동 배정할 학생 이름을 입력하세요:', '');
        if (manualName === null) return;
        const cleanName = manualName.trim() || '수동배정';
        const record = {
          seat: seatNum,
          name: cleanName,
          time: formatTime(),
          drawId: 'manual_' + Date.now()
        };
        state.assigned = [...state.assigned, record];
        state.updatedAt = Date.now();
        saveStateToLocal();
        renderAdminBoardOnly();

        await broadcastPayload({
          type: 'ASSIGN_SEAT',
          resetId: state.resetId,
          totalSeats: state.totalSeats,
          record: record
        });
      }
    }

    function openQrModal() {
      showQrModal = true;
      lastRenderedQrUrl = '';
      renderQrModalOnly();
    }

    function closeQrModal() {
      showQrModal = false;
      lastRenderedQrUrl = '';
      renderQrModalOnly();
    }

    function renderQrCode(targetUrl) {
      const container = document.getElementById('qrcode-container');
      if (!container) return;
      if (lastRenderedQrUrl === targetUrl && container.children.length > 0) return;
      container.innerHTML = '';
      if (!targetUrl) return;
      lastRenderedQrUrl = targetUrl;
      new QRCode(container, {
        text: targetUrl,
        width: 230,
        height: 230,
        colorDark: '#0f172a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function renderStudentView() {
      const app = document.getElementById('app');

      if (studentStep === 'input') {
        app.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-b from-indigo-50 to-slate-100">
            <form onsubmit="handleStudentDraw(event)" class="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full text-center border border-indigo-100 animate-pop">
              <span class="inline-block px-3.5 py-1 bg-indigo-100 text-indigo-700 font-semibold text-xs rounded-full mb-3">
                학급 자리 뽑기
              </span>
              <h1 class="text-2xl font-extrabold text-slate-900 mb-2">이름을 입력하세요</h1>
              <p class="text-sm text-slate-500 mb-6">본인의 이름을 정확히 입력한 뒤 아래 버튼을 누르면 자리가 배정됩니다.</p>

              <input
                id="studentNameField"
                type="text"
                maxlength="15"
                required
                placeholder="예: 김민준"
                value="${studentNameInput.replace(/"/g, '&quot;')}"
                oninput="studentNameInput = this.value"
                class="w-full px-4 py-4 text-center text-xl font-bold border-2 border-slate-300 rounded-2xl focus:outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 mb-3"
              />

              ${studentErrorMsg ? `<p class="text-sm text-rose-600 font-semibold mb-3 leading-relaxed">${studentErrorMsg}</p>` : ''}

              <button type="submit"
                class="w-full py-4 mt-2 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-lg rounded-2xl shadow-lg shadow-indigo-200 transition">
                내 자리 번호 뽑기
              </button>
            </form>
          </div>
        `;
        setTimeout(() => {
          const el = document.getElementById('studentNameField');
          if (el) el.focus();
        }, 50);
        return;
      }

      if (studentStep === 'drawing') {
        app.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50">
            <div class="bg-white rounded-3xl shadow-lg p-8 max-w-sm w-full text-center border border-slate-200">
              <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <h2 class="text-lg font-bold text-slate-800">자리를 배정하고 있습니다...</h2>
              <p class="text-xs text-slate-400 mt-1">잠시만 기다려 주세요</p>
            </div>
          </div>
        `;
        return;
      }

      if (studentStep === 'full') {
        app.innerHTML = `
          <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-100">
            <div class="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full text-center border border-slate-200 animate-pop">
              <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">!</div>
              <h1 class="text-2xl font-bold text-slate-900 mb-2">남은 자리가 없습니다</h1>
              <p class="text-slate-600 mb-6">모든 좌석(${state.totalSeats}석)이 이미 배정되었습니다. 선생님께 말씀드려 주세요.</p>
              <button onclick="studentStep = 'input'; studentNameInput = ''; render();"
                class="w-full py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl transition">
                처음 화면으로
              </button>
            </div>
          </div>
        `;
        return;
      }

      const isAlready = studentStep === 'already';
      app.innerHTML = `
        <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-b from-indigo-50 to-slate-100">
          <div class="bg-white rounded-3xl shadow-2xl p-8 sm:p-10 max-w-md w-full text-center border border-indigo-100 animate-pop">
            <span class="inline-block px-3.5 py-1 ${isAlready ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-700'} font-semibold text-sm rounded-full mb-4">
              ${isAlready ? '이미 배정된 자리입니다' : '자리 배정 완료'}
            </span>
            <p class="text-slate-700 text-xl font-bold mb-1">${studentResult.name} 학생의 자리는</p>
            <div class="my-6 py-8 px-4 bg-indigo-600 rounded-2xl shadow-inner text-white">
              <div class="text-7xl sm:text-8xl font-extrabold tracking-tight">${studentResult.seat}<span class="text-3xl font-bold ml-1">번</span></div>
            </div>
            <p class="text-sm text-slate-400 mb-8">배정 시각: ${studentResult.time}</p>

            <button onclick="studentStep = 'input'; studentNameInput = ''; studentResult = null; render();"
              class="w-full py-4 bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-bold text-lg rounded-2xl shadow-md transition">
              확인 완료 (다음 학생 입력)
            </button>
            <p class="text-xs text-slate-400 mt-3">공용 태블릿 사용 시 위 버튼을 눌러 다음 친구가 이름을 입력할 수 있게 해주세요.</p>
          </div>
        </div>
      `;
    }

    // 배경 좌석 현황판만 업데이트 (열려있는 QR 모달은 절대 건드리지 않음)
    function renderAdminBoardOnly() {
      const app = document.getElementById('app');
      const assignedMap = new Map(state.assigned.map(item => [item.seat, item]));
      const assignedCount = state.assigned.length;
      const remainingCount = Math.max(0, state.totalSeats - assignedCount);

      // 현재 입력창에 포커스가 있다면 입력 중인 값 보존
      const activeInput = document.getElementById('seatCountInput');
      const currentInputVal = (activeInput && document.activeElement === activeInput)
        ? activeInput.value
        : state.totalSeats;

      let seatsHtml = '';
      for (let i = 1; i <= state.totalSeats; i++) {
        const info = assignedMap.get(i);
        if (info) {
          seatsHtml += `
            <button onclick="toggleSeatManually(${i})" title="클릭하여 배정 취소"
              class="group relative flex flex-col items-center justify-center p-3.5 rounded-2xl bg-slate-200 border-2 border-slate-300 text-slate-600 transition hover:border-slate-400">
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-slate-300 text-slate-700 mb-1">배정 완료</span>
              <span class="text-3xl font-extrabold text-slate-700">${i}</span>
              <span class="text-sm font-extrabold text-slate-900 mt-1 truncate max-w-full px-1">${info.name || '이름없음'}</span>
              <span class="text-[10px] text-slate-500 mt-0.5">${info.time}</span>
            </button>
          `;
        } else {
          seatsHtml += `
            <button onclick="toggleSeatManually(${i})" title="클릭하여 수동 배정"
              class="group relative flex flex-col items-center justify-center p-3.5 rounded-2xl bg-white border-2 border-indigo-100 hover:border-indigo-400 text-slate-800 shadow-sm transition">
              <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 mb-1">대기 중</span>
              <span class="text-3xl font-extrabold text-slate-900">${i}</span>
              <span class="text-sm font-medium text-slate-300 mt-1">-</span>
              <span class="text-[10px] text-slate-400 mt-0.5">미배정</span>
            </button>
          `;
        }
      }

      const syncBadge = syncStatus === 'connected'
        ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>실시간 연동 켜짐</span>`
        : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">실시간 서버 연결 중...</span>`;

      app.innerHTML = `
        <div class="max-w-6xl mx-auto p-4 sm:p-8">
          <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-6">
            <div>
              <div class="flex flex-wrap items-center gap-2.5">
                <span class="px-2.5 py-1 bg-indigo-600 text-white text-xs font-bold rounded-lg">교사용 관리자</span>
                <h1 class="text-2xl font-extrabold text-slate-900">학급 자리 배치 현황판</h1>
                ${syncBadge}
              </div>
              <p class="text-sm text-slate-500 mt-1.5">학생이 QR을 찍어 이름을 입력하면 즉시 회색과 이름이 반영됩니다.</p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <button onclick="openQrModal()"
                class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-sm transition flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                </svg>
                학생용 QR 코드 크게 보기
              </button>

              <button onclick="window.open('?mode=student', '_blank')"
                class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-sm transition">
                학생 화면 테스트
              </button>
            </div>
          </header>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-6">
            <div class="lg:col-span-6 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <label for="seatCountInput" class="font-bold text-slate-700">총 학생 수:</label>
                <input id="seatCountInput" type="number" min="1" max="100" value="${currentInputVal}"
                  class="w-24 px-3 py-2 border border-slate-300 rounded-xl font-bold text-center text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                <span class="text-slate-600 font-medium">명</span>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="handleSetTotalSeats(document.getElementById('seatCountInput').value)"
                  class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold rounded-xl transition">
                  인원 적용 및 초기화
                </button>
                <button onclick="resetAssignments()"
                  class="px-3.5 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-semibold rounded-xl transition">
                  기록만 초기화
                </button>
              </div>
            </div>

            <div class="lg:col-span-6 grid grid-cols-3 gap-3">
              <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm text-center">
                <div class="text-xs font-semibold text-slate-400">전체 좌석</div>
                <div class="text-2xl font-extrabold text-slate-900 mt-1">${state.totalSeats}석</div>
              </div>
              <div class="bg-slate-200/80 p-4 rounded-2xl border border-slate-300 text-center">
                <div class="text-xs font-semibold text-slate-600">배정 완료 (회색)</div>
                <div class="text-2xl font-extrabold text-slate-700 mt-1">${assignedCount}명</div>
              </div>
              <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-100 text-center">
                <div class="text-xs font-semibold text-indigo-600">남은 좌석</div>
                <div class="text-2xl font-extrabold text-indigo-700 mt-1">${remainingCount}석</div>
              </div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-bold text-slate-800">좌석 번호 및 배정 학생 현황 (클릭 시 수동 배정/취소)</h2>
              <div class="flex items-center gap-4 text-xs font-medium text-slate-500">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-white border border-indigo-300 inline-block"></span>미배정</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-sm bg-slate-300 inline-block"></span>배정 완료</span>
              </div>
            </div>
            <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3">
              ${seatsHtml}
            </div>
          </div>
        </div>
      `;
    }

    // QR 모달은 별도 레이어(#modal-root)에서 열릴 때 딱 한 번만 렌더링되어 깜빡임/튕김 원천 차단
    function renderQrModalOnly() {
      const modalRoot = document.getElementById('modal-root');
      if (!modalRoot) return;

      if (!showQrModal) {
        modalRoot.innerHTML = '';
        return;
      }

      const studentUrl = getStudentJoinUrl(customHostInput);
      const isLocalOrPreview = !(window.location.protocol === 'http:' || window.location.protocol === 'https:');

      modalRoot.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
          <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 text-center shadow-2xl animate-pop">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-xl font-extrabold text-slate-900">학생 입장용 QR 코드</h3>
              <button onclick="closeQrModal()" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
            </div>
            <p class="text-sm text-slate-600 mb-5">태블릿 카메라로 아래 QR 코드를 스캔한 뒤<br/><strong>이름을 입력</strong>하면 중복 없는 자리 번호가 즉시 나옵니다.</p>

            <div class="bg-white p-4 rounded-2xl border-2 border-slate-200 inline-flex items-center justify-center mb-4 min-h-[262px] min-w-[262px]">
              ${studentUrl
                ? `<div id="qrcode-container"></div>`
                : `<div class="text-sm text-amber-700 bg-amber-50 p-4 rounded-xl max-w-[240px]">
                    현재 로컬 파일 환경입니다. 아래에 버셀 배포 주소(https://...)를 입력하면 QR 코드가 생성됩니다.
                  </div>`
              }
            </div>

            ${studentUrl ? `
              <div class="mb-4">
                <div class="text-xs text-slate-400 break-all bg-slate-50 p-2.5 rounded-xl border border-slate-200 mb-2">${studentUrl}</div>
                <button onclick="navigator.clipboard.writeText('${studentUrl}'); alert('학생용 접속 주소가 복사되었습니다.');"
                  class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">
                  접속 링크 복사하기
                </button>
              </div>
            ` : ''}

            ${isLocalOrPreview ? `
              <div class="text-left bg-slate-50 p-3.5 rounded-xl border border-slate-200 mb-4">
                <label class="block text-xs font-bold text-slate-700 mb-1">배포된 웹 주소 입력 (선택)</label>
                <div class="flex gap-2">
                  <input id="customHostInputEl" type="url" placeholder="https://seat-qr.vercel.app" value="${customHostInput}"
                    class="flex-1 px-3 py-1.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                  <button onclick="customHostInput = document.getElementById('customHostInputEl').value; lastRenderedQrUrl = ''; renderQrModalOnly();"
                    class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-lg">적용</button>
                </div>
              </div>
            ` : ''}

            <button onclick="closeQrModal()"
              class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl transition">
              닫기
            </button>
          </div>
        </div>
      `;

      if (studentUrl) {
        setTimeout(() => renderQrCode(studentUrl), 0);
      }
    }

    function render() {
      if (isStudentMode) {
        renderStudentView();
      } else {
        renderAdminBoardOnly();
        renderQrModalOnly();
      }
    }

    render();
    initRealtimeEngines();
  </script>
</body>
</html>
